name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Liberar espacio en disco
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt clean

    - name: Dependencias
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
        libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
        libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

    - name: Herramienta repo
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        sudo ln -sf ~/.bin/repo /usr/bin/repo

    - name: Sincronizar TWRP Minimal
      run: |
        mkdir twrp && cd twrp
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clonar Device Tree
      run: |
        cd twrp
        git clone https://github.com/voyagervoyager880-oss/android_device_samsung_a11.git device/samsung/a11

    - name: Compilar recovery.img
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_a11-eng || lunch twrp_a11-eng
        mka recoveryimage -j$(nproc --all)

    - name: Publicar Release
      uses: softprops/action-gh-release@v1
      with:
        files: twrp/out/target/product/a11/recovery.img
        name: TWRP SM-A115M
        tag_name: twrp-${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
